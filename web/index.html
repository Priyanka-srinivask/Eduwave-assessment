<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavy Tutor — Grade 5 Fractions</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0;
            --muted:#94a3b8; --learner:#334155; --tutor:#0c4a6e; --warn:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); height:100vh; display:flex;
           flex-direction:column; }
    header { padding:14px 20px; background:var(--panel); border-bottom:1px solid #334155;
             display:flex; align-items:center; gap:10px; }
    header h1 { font-size:18px; margin:0; }
    header .status { font-size:12px; color:var(--muted); margin-left:auto; }
    #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column;
            gap:14px; max-width:820px; width:100%; margin:0 auto; }
    .msg { padding:12px 16px; border-radius:12px; max-width:80%; line-height:1.45; }
    .msg.learner { background:var(--learner); align-self:flex-end; }
    .msg.tutor { background:var(--tutor); align-self:flex-start; }
    .msg .meta { font-size:11px; color:var(--muted); margin-top:8px; border-top:1px dashed #475569;
                 padding-top:6px; }
    .msg .meta code { color:var(--accent); }
    .msg .nextq { margin-top:8px; font-style:italic; color:#bae6fd; }
    .flag { display:inline-block; background:var(--warn); color:#000; font-size:11px;
            padding:1px 6px; border-radius:6px; margin-right:4px; }
    footer { padding:14px 20px; background:var(--panel); border-top:1px solid #334155; }
    form { display:flex; gap:10px; max-width:820px; margin:0 auto; }
    input[type=text] { flex:1; padding:12px; border-radius:10px; border:1px solid #475569;
            background:#0b1220; color:var(--text); font-size:15px; }
    button { padding:12px 20px; border:none; border-radius:10px; background:var(--accent);
             color:#00232f; font-weight:600; cursor:pointer; font-size:15px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .hint { color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
  </style>
</head>
<body>
  <header>
    <h1>🌊 Wavy Tutor</h1>
    <span class="status" id="status">connecting…</span>
  </header>
  <div id="chat">
    <div class="msg tutor">Hi! I'm Wavy. I help with <b>Grade 5 fractions</b>.
      Ask me something like <i>"Is 2/5 bigger than 1/2?"</i> — I'll help you figure it out,
      not just hand you the answer. 😊</div>
  </div>
  <footer>
    <form id="form">
      <input type="text" id="input" placeholder="Ask a fractions question…" autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
    <div class="hint">Citations &amp; telemetry are shown under each reply so you can see the grounding.</div>
  </footer>

  <script>
    let sessionId = null;
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');

    function addMessage(text, role, extra) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = text.replace(/</g, '&lt;');
      if (extra) div.innerHTML += extra;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function init() {
      try {
        const h = await (await fetch('/health')).json();
        statusEl.textContent = `provider: ${h.provider} · model: ${h.model}`;
        const r = await fetch('/api/sessions', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ language: 'en' })
        });
        sessionId = (await r.json()).id;
      } catch (e) {
        statusEl.textContent = 'offline — is the server running?';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !sessionId) return;
      addMessage(text, 'learner');
      input.value = '';
      sendBtn.disabled = true;
      const thinking = addMessage('…thinking', 'tutor');
      try {
        const r = await fetch(`/api/sessions/${sessionId}/messages`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ message: text })
        });
        const data = await r.json();
        const resp = data.response;
        const t = data.telemetry || {};
        let extra = '';
        if (resp.nextQuestion) extra += `<div class="nextq">👉 ${resp.nextQuestion.replace(/</g,'&lt;')}</div>`;
        let flags = (resp.safetyFlags||[]).map(f=>`<span class="flag">${f}</span>`).join('');
        extra += `<div class="meta">${flags}` +
          `cite: <code>${(resp.curriculumCitations||[]).join(', ')||'none'}</code> · ` +
          `conf: ${resp.confidence} · ${t.latency_ms??'?'}ms · ${t.provider??'?'}</div>`;
        thinking.className = 'msg tutor';
        thinking.innerHTML = resp.tutorMessage.replace(/</g,'&lt;') + extra;
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        thinking.textContent = 'Sorry — something went wrong. Please try again.';
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    init();
  </script>
</body>
</html>
